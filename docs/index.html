<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ollajev · local decision models</title>
<meta name="description" content="Run System One decision models from Hugging Face on your machine, behind the same /v1/systemone API as TypeSafe's hosted Jev.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root {
  --bg: #fafaf7; --surface: #ffffff; --ink: #14171c; --muted: #5d6673; --rule: #e3e3dc;
  --signal: #2a78d6; --signal-soft: #e6f0fc; --code-bg: #101418; --code-ink: #d7dde6; --ok: #1f8a5b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #151a21; --ink: #e8ebf0; --muted: #9aa4b2; --rule: #262d37;
    --signal: #5aa2f0; --signal-soft: #17283d; --code-bg: #0a0d11; --ok: #4cc38a;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #151a21; --ink: #e8ebf0; --muted: #9aa4b2; --rule: #262d37;
  --signal: #5aa2f0; --signal-soft: #17283d; --code-bg: #0a0d11; --ok: #4cc38a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--signal); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
section { padding: 72px 0; border-top: 1px solid var(--rule); }
h2 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; }
.lede { color: var(--muted); max-width: 62ch; margin: 0 0 32px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--signal); margin-bottom: 10px; }

nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
nav .wrap { display: flex; align-items: center; gap: 22px; height: 58px; }
nav .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); font-size: 18px; letter-spacing: -0.02em; }
nav .brand img { width: 28px; height: 28px; }
nav .links { display: flex; gap: 20px; margin-left: auto; font-size: 14px; }
nav .links a { color: var(--muted); }
nav .links a:hover { color: var(--ink); text-decoration: none; }
.icon-btn { background: transparent; border: 1px solid var(--rule); color: var(--muted); border-radius: 6px; padding: 4px 9px; font: 12px var(--mono); cursor: pointer; }
.icon-btn:hover { color: var(--ink); }

.hero { padding: 84px 0 64px; border-top: 0; }
.hero h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1.05; letter-spacing: -0.035em; margin: 0 0 18px; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--signal); }
.hero p { font-size: 19px; color: var(--muted); max-width: 56ch; margin: 0 0 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid var(--rule); color: var(--ink); background: var(--surface); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn:hover { text-decoration: none; filter: brightness(1.06); }
.note { font-size: 13px; color: var(--muted); margin-top: 16px; }

.cmd { position: relative; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 16px 64px 16px 18px; font: 13.5px/1.6 var(--mono); overflow-x: auto; white-space: pre; }
.cmd .copy { position: absolute; top: 10px; right: 10px; background: #1d242d; color: #aeb8c6; border: 1px solid #2c3541; border-radius: 6px; padding: 3px 9px; font: 11.5px var(--mono); cursor: pointer; }
.cmd .copy:hover { color: #fff; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.tab { background: transparent; border: 1px solid var(--rule); color: var(--muted); padding: 5px 13px; border-radius: 6px; font: 13px var(--sans); cursor: pointer; }
.tab.on { background: var(--signal-soft); color: var(--signal); border-color: var(--signal); }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.card .glyph { font: 600 13px var(--mono); color: var(--signal); background: var(--signal-soft); display: inline-block; padding: 2px 8px; border-radius: 5px; margin-bottom: 10px; }

.demo { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: start; }
@media (max-width: 820px) { .demo { grid-template-columns: 1fr; } nav .links a:not(.keep) { display: none; } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); font: 600 12px var(--mono); color: var(--muted); }
.panel-body { padding: 16px; }
.state { font-weight: 600; margin: 0 0 16px; }
.q { margin-bottom: 18px; }
.q:last-child { margin-bottom: 0; }
.q-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; }
.q-head .type { font: 12px var(--mono); color: var(--muted); }
.q-head .ask { color: var(--ink); }
.row { display: grid; grid-template-columns: 130px 1fr 52px; gap: 10px; align-items: center; font: 12px var(--mono); padding: 2px 0; color: var(--muted); }
.row.top { color: var(--ink); font-weight: 600; }
.track { height: 7px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--signal); border-radius: 3px; transition: width 600ms cubic-bezier(.2,0,0,1); }
.row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.pickers { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 14px; font: 13px var(--sans); color: var(--muted); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
pre.json { margin: 0; padding: 16px; background: var(--code-bg); color: var(--code-ink); font-size: 12px; line-height: 1.55; overflow-x: auto; }

.filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filter input { flex: 1 1 220px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: 14px var(--sans); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font: 600 11.5px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td code { font-size: 12.5px; }
td.desc { white-space: normal; color: var(--muted); min-width: 240px; }
.tag { font: 11px var(--mono); padding: 1px 7px; border-radius: 4px; background: var(--signal-soft); color: var(--signal); }
.tag.def { background: var(--ok); color: #fff; }

.steps { counter-reset: s; display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; }
.step::before { counter-increment: s; content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--signal-soft); color: var(--signal); display: grid; place-items: center; font: 600 14px var(--mono); }
.step h3 { margin: 4px 0 6px; font-size: 16px; }
.step p { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; }

footer { border-top: 1px solid var(--rule); padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
footer .push { margin-left: auto; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { html, render, useState, useEffect } from "https://esm.sh/htm@3.1.1/preact/standalone";

const REPO = "https://github.com/nvkudva/ollajev";
const RAW = "https://raw.githubusercontent.com/nvkudva/ollajev/main";

const MODELS = [
  ["Mapika/decider-4b-GGUF:Q4_K_M", 2.7, "llama.cpp", "English", "Qwen3.5-4B decider, 4-bit GGUF", true],
  ["Mapika/decider-2b-GGUF:Q4_K_M", 1.2, "llama.cpp", "English", "Qwen3.5-2B decider, 4-bit GGUF"],
  ["Mapika/decider-2b-GGUF:Q8_0", 2.0, "llama.cpp", "English", "Qwen3.5-2B decider, 8-bit GGUF"],
  ["Mapika/decider-2b", 3.76, "PyTorch", "English", "Qwen3.5-2B decider, bf16"],
  ["Mapika/decider-0.8b", 1.5, "PyTorch", "English", "Qwen3.5-0.8B decider, bf16"],
  ["convaiinnovations/laya", 0.85, "PyTorch", "English", "Laya, ModernBERT-large, general purpose"],
  ["convaiinnovations/laya-multilingual", 0.68, "PyTorch", "100+ languages", "Laya, mmBERT-base"],
  ["convaiinnovations/laya-typed-decisions", 0.85, "PyTorch", "English", "Laya tuned for agent traces, support, invoices"],
  ["SupersonicLabs/Julia-1", 0.57, "PyTorch", "Multilingual", "Julia 1, mmBERT-small, 2-20 options"],
  ["com-kotobalabs/open-jev-deberta-v3-large", 1.74, "PyTorch", "English", "open-jev, DeBERTa-v3-large"],
  ["jaredpalmer/kev-0.5b", 1.0, "PyTorch", "English", "Kev, LoRA + pointer head on Qwen2.5-0.5B"],
  ["jaredpalmer/kev-0.6b", 1.2, "PyTorch", "English", "Kev, LoRA + pointer head on Qwen3-0.6B"],
  ["jaredpalmer/kev-0.8b", 1.7, "PyTorch", "English", "Kev, LoRA + pointer head on Qwen3.5-0.8B"],
  ["internlm/Intern-Decision-0.8B", 1.7, "PyTorch", "Multilingual", "Intern-Decision, Qwen3.5-0.8B"],
  ["llm-semantic-router/Decision-1.0-Kai-0.6B", 2.28, "PyTorch", "English", "Decision-1.0 Kai, Vela encoder"],
  ["llm-semantic-router/Decision-1.0-Lex-0.6B", 2.28, "PyTorch", "English", "Decision-1.0 Lex, tuned for support, invoices, agent traces"],
].map(([name, gb, runtime, languages, description, isDefault]) => ({ name, gb, runtime, languages, description, isDefault }));

const EXAMPLES = {
  Support: {
    state: "I was charged twice for the same order and nobody answers my emails. I want my money back now.",
    request: {
      area: { type: "choice", instructions: "Which product area is this about?", criteria: { "refund & dispute": "A billing dispute or refund request", card: "Anything about a card", other: null } },
      urgency: { type: "score", instructions: "How urgent is this message?", criteria: ["Can wait", "Needs attention this week", "Needs attention today"] },
      refund: { type: "noul", instructions: "The customer is asking for a refund." },
    },
    answers: {
      area: { type: "choice", choice: "refund & dispute", confidence: 0.9642, probabilities: { "refund & dispute": 0.9761, card: 0.0104, other: 0.0135 } },
      urgency: { type: "score", score: 1.712, confidence: 0.568, legend: { 0: "Can wait", 1: "Needs attention this week", 2: "Needs attention today" }, probabilities: { 0: 0.0099, 1: 0.2682, 2: 0.7219 } },
      refund: { type: "noul", noul: 0.9433, confidence: 0.8866 },
    },
  },
  Email: {
    state: "Hi team, quick heads up: the vendor contract renews on the 30th and legal still has not signed off. Can someone own this before Friday?",
    request: {
      kind: { type: "choice", instructions: "What kind of message is this?", criteria: { "action request": "Someone must do something", fyi: "Information only", question: null } },
      deadline: { type: "noul", instructions: "The message contains a deadline." },
      priority: { type: "score", instructions: "How important is this?", criteria: ["Low", "Medium", "High"] },
    },
    answers: {
      kind: { type: "choice", choice: "action request", confidence: 0.91, probabilities: { "action request": 0.9312, fyi: 0.0488, question: 0.02 } },
      deadline: { type: "noul", noul: 0.9871, confidence: 0.9742 },
      priority: { type: "score", score: 1.64, confidence: 0.61, legend: { 0: "Low", 1: "Medium", 2: "High" }, probabilities: { 0: 0.0301, 1: 0.2899, 2: 0.68 } },
    },
  },
  "Agent trace": {
    state: "Tool call web.search returned 0 results three times in a row; the agent is retrying the identical query.",
    request: {
      stuck: { type: "noul", instructions: "The agent is stuck in a loop." },
      action: { type: "choice", instructions: "What should the harness do next?", criteria: { continue: "Let it keep going", rephrase: "Ask the agent to change its query", abort: "Stop the run" } },
    },
    answers: {
      stuck: { type: "noul", noul: 0.9624, confidence: 0.9248 },
      action: { type: "choice", choice: "rephrase", confidence: 0.78, probabilities: { rephrase: 0.8113, abort: 0.1342, continue: 0.0545 } },
    },
  },
};

const INSTALL = {
  "macOS / Linux": `curl -fsSL ${RAW}/install.sh | sh`,
  Windows: `irm ${RAW}/install.ps1 | iex`,
  uv: `uv tool install git+${REPO}`,
};

function Copy({ text }) {
  const [done, setDone] = useState(false);
  const go = () => navigator.clipboard?.writeText(text).then(() => { setDone(true); setTimeout(() => setDone(false), 1400); });
  return html`<button class="copy" onClick=${go}>${done ? "copied" : "copy"}</button>`;
}

function Command({ text }) {
  return html`<div class="cmd">${text}<${Copy} text=${text} /></div>`;
}

function Nav({ theme, setTheme }) {
  const next = { system: "light", light: "dark", dark: "system" }[theme];
  return html`<nav><div class="wrap">
    <a class="brand" href="#top"><img src="logo.svg" alt="" />ollajev</a>
    <div class="links">
      <a href="#demo">Demo</a><a href="#models">Models</a><a href="#start">Quick start</a>
      <a class="keep" href=${REPO}>GitHub</a>
    </div>
    <button class="icon-btn" title="Switch theme" onClick=${() => setTheme(next)}>${theme}</button>
  </div></nav>`;
}

function Hero() {
  return html`<section class="hero" id="top"><div class="wrap">
    <div class="eyebrow">System One · local · drop-in</div>
    <h1>Decision models that run <em>on your machine</em>.</h1>
    <p>Pull a System One model from Hugging Face and call it through the same <code>/v1/systemone</code> API as TypeSafe's hosted Jev. One forward pass, calibrated probabilities, no text generated.</p>
    <div class="cta">
      <a class="btn primary" href="#start">Install ollajev</a>
      <a class="btn" href=${REPO}>View on GitHub</a>
    </div>
    <div class="note">Point <code>TYPESAFE_BASE_URL</code> at the local server and the stock <code>typesafe-sdk</code> keeps working. No API key needed.</div>
  </div></section>`;
}

function Features() {
  const items = [
    ["noul", "Yes / no", "A probability that a statement about the state is true."],
    ["choice", "Pick one", "Choose among named options and get the full distribution."],
    ["score", "Rate on a scale", "Expected level on an ordered rubric, with per-level probabilities."],
    ["API", "Drop-in compatible", "Same routes and shapes as TypeSafe's Jev. Swap the base URL, keep your code."],
    ["CLI", "Ollama-style CLI", "serve, pull, run, list, ps, show, rm, stop, cp. Models load on first use and unload when idle."],
    ["RAM", "Fits-in-memory guard", "Refuses to load a model that does not fit in free memory instead of thrashing."],
  ];
  return html`<section><div class="wrap">
    <div class="eyebrow">What you get</div>
    <h2>Typed questions in, probabilities out.</h2>
    <p class="lede">Send one state and any number of typed questions. A decision model never writes text, so every answer is a number you can threshold, log and route on.</p>
    <div class="grid">${items.map(([g, t, d]) => html`<div class="card"><span class="glyph">${g}</span><h3>${t}</h3><p>${d}</p></div>`)}</div>
  </div></section>`;
}

function Bars({ answer }) {
  const top = Object.entries(answer.probabilities ?? { true: answer.noul, false: 1 - answer.noul }).sort((a, b) => b[1] - a[1]);
  return top.map(([k, v], i) => {
    const label = answer.legend?.[k] ?? (k === "true" ? "yes" : k === "false" ? "no" : k);
    return html`<div class=${"row" + (i === 0 ? " top" : "")} title=${label}>
      <span>${label}</span><div class="track"><div class="fill" style=${{ width: `${v * 100}%` }}></div></div><span>${(v * 100).toFixed(1)}%</span>
    </div>`;
  });
}

function Demo() {
  const keys = Object.keys(EXAMPLES);
  const [key, setKey] = useState(keys[0]);
  const [shown, setShown] = useState(false);
  const ex = EXAMPLES[key];
  useEffect(() => { setShown(false); const t = setTimeout(() => setShown(true), 60); return () => clearTimeout(t); }, [key]);
  const body = JSON.stringify({ state: ex.state, questions: ex.request }, null, 2);
  const out = JSON.stringify({ answers: ex.answers }, null, 2);
  return html`<section id="demo"><div class="wrap">
    <div class="eyebrow">See it work</div>
    <h2>One request, every answer calibrated.</h2>
    <p class="lede">Real response shapes from the README. Pick an example to see the request and what comes back.</p>
    <div class="pickers">${keys.map((k) => html`<button class=${"chip" + (k === key ? " on" : "")} onClick=${() => setKey(k)}>${k}</button>`)}</div>
    <div class="demo">
      <div class="panel">
        <div class="panel-head">POST /v1/systemone</div>
        <pre class="json">${body}</pre>
      </div>
      <div class="panel">
        <div class="panel-head">answers</div>
        <div class="panel-body">
          <p class="state">${ex.state}</p>
          ${Object.entries(ex.answers).map(([name, a]) => html`<div class="q">
            <div class="q-head"><span class="ask">${ex.request[name].instructions}</span><span class="type">${a.type}</span></div>
            ${shown ? html`<${Bars} answer=${a} />` : null}
          </div>`)}
        </div>
        <pre class="json" style="border-top:1px solid var(--rule);max-height:220px">${out}</pre>
      </div>
    </div>
  </div></section>`;
}

function Models() {
  const [q, setQ] = useState("");
  const rows = MODELS.filter((m) => `${m.name} ${m.description} ${m.runtime} ${m.languages}`.toLowerCase().includes(q.toLowerCase()));
  return html`<section id="models"><div class="wrap">
    <div class="eyebrow">Curated models</div>
    <h2>${MODELS.length} models, each checked against the API.</h2>
    <p class="lede">Pick one with the request's <code>model</code> field. Any other System One repo on Hugging Face works too: <code>ollajev pull user/repo</code>.</p>
    <div class="filter"><input type="search" placeholder="Filter by name, runtime or language" value=${q} onInput=${(e) => setQ(e.target.value)} /></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Model</th><th>Download</th><th>Runs on</th><th>Languages</th><th>About</th></tr></thead>
      <tbody>${rows.map((m) => html`<tr>
        <td><code>${m.name}</code> ${m.isDefault ? html`<span class="tag def">default</span>` : null}</td>
        <td>${m.gb} GB</td><td><span class="tag">${m.runtime}</span></td><td>${m.languages}</td><td class="desc">${m.description}</td>
      </tr>`)}${rows.length ? null : html`<tr><td colspan="5">No model matches "${q}".</td></tr>`}</tbody>
    </table></div>
  </div></section>`;
}

function Start() {
  const [os, setOs] = useState(Object.keys(INSTALL)[0]);
  return html`<section id="start"><div class="wrap">
    <div class="eyebrow">Quick start</div>
    <h2>Running in three commands.</h2>
    <p class="lede">The installer sets up uv if it is missing, then installs <code>ollajev</code> in its own Python environment.</p>
    <div class="steps">
      <div class="step"><div>
        <h3>Install</h3>
        <div class="tabs">${Object.keys(INSTALL).map((k) => html`<button class=${"tab" + (k === os ? " on" : "")} onClick=${() => setOs(k)}>${k}</button>`)}</div>
        <${Command} text=${INSTALL[os]} />
      </div></div>
      <div class="step"><div>
        <h3>Pick a model and serve</h3>
        <p>First run opens the model manager. Choose a model, press Enter to download it, then <code>s</code> to serve.</p>
        <${Command} text="ollajev" />
      </div></div>
      <div class="step"><div>
        <h3>Ask it something</h3>
        <p>From another terminal, or call <code>http://127.0.0.1:8000/v1/systemone</code> from any client.</p>
        <${Command} text="ollajev run" />
      </div></div>
    </div>
    <p class="note">The built-in demo playground is served at <code>/demo</code> on your running server, with a model picker in the header.</p>
  </div></section>`;
}

function Footer() {
  return html`<footer><div class="wrap">
    <span>Apache 2.0</span>
    <a href=${REPO}>github.com/nvkudva/ollajev</a>
    <a href=${REPO + "/blob/main/CHANGELOG.md"}>Changelog</a>
    <span class="push">Independent project. Not affiliated with or endorsed by Ollama or TypeSafe.</span>
  </div></footer>`;
}

function App() {
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("ollajev.theme") || "system"; } catch { return "system"; } });
  useEffect(() => {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("ollajev.theme", theme); } catch {}
  }, [theme]);
  return html`<${Nav} theme=${theme} setTheme=${setTheme} /><${Hero} /><${Features} /><${Demo} /><${Models} /><${Start} /><${Footer} />`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
<noscript><p style="padding:24px">ollajev runs System One decision models locally. See <a href="https://github.com/nvkudva/ollajev">github.com/nvkudva/ollajev</a>.</p></noscript>
</body>
</html>
